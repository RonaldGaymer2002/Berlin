<!DOCTYPE html>
<html lang="es" class="h-full w-full overflow-hidden">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Visor y Calibrador del Plano Oficial | Proyecto Berlín - Hardeman</title>
  <meta name="description"
    content="Visor WebGIS interactivo del Proyecto Berlín en Hardeman (Santa Cruz) con herramienta de calibración manual en vivo sobre imagen satelital Esri y OpenStreetMap." />

  <!-- Favicon SVG -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Leaflet CSS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            coral: {
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Outfit"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Contenedor del Mapa 100% Pantalla */
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background-color: #0b1329;
    }

    /* UI Flotante con Z-Index Superior */
    .floating-ui {
      z-index: 1100;
    }

    /* Selector de Modos */
    .mode-selector {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(226, 232, 240, 0.9);
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-modo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      color: #475569;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .btn-modo:hover:not(.active) {
      background-color: #f1f5f9;
      color: #0f172a;
      transform: translateY(-1px);
    }

    .btn-modo.active {
      background-color: #15803d;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(21, 128, 61, 0.4);
    }

    @media (max-width: 640px) {
      .mode-selector {
        padding: 3px;
        gap: 2px;
      }
      .btn-modo {
        padding: 6px 10px;
        font-size: 0.72rem;
        gap: 4px;
      }
    }

    /* Panel de Calibración Flotante */
    .calib-panel {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 20px;
      color: #f8fafc;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Iconos Personalizados de las Esquinas Arrastrables */
    .custom-corner-icon {
      background-color: #22c55e;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(34, 197, 94, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 11px;
      cursor: grab;
      transition: transform 0.15s ease;
    }

    .custom-corner-icon:active {
      cursor: grabbing;
      transform: scale(1.2);
    }

    .custom-corner-icon.se {
      background-color: #ea580c;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(234, 88, 12, 0.4);
    }

    /* Controles de Zoom Leaflet */
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25) !important;
      border-radius: 14px !important;
      overflow: hidden;
      margin-top: 70px !important;
      margin-left: 16px !important;
    }

    .leaflet-control-zoom a {
      background-color: #ffffff !important;
      color: #0f172a !important;
      width: 38px !important;
      height: 38px !important;
      line-height: 38px !important;
      font-size: 18px !important;
    }

    .leaflet-control-zoom a:hover {
      background-color: #f8fafc !important;
      color: #15803d !important;
    }
  </style>
</head>

<body class="h-full w-full relative">

  <!-- ====================================================================== -->
  <!-- 1. CONTENEDOR DEL MAPA FULLSCREEN -->
  <!-- ====================================================================== -->
  <div id="map"></div>

  <!-- ====================================================================== -->
  <!-- 2. SELECTOR FLOTANTE DE 3 MODOS (SUPERIOR CENTRADO) -->
  <!-- ====================================================================== -->
  <div class="floating-ui absolute top-4 left-1/2 -translate-x-1/2 mode-selector">
    <button id="btn-plano" class="btn-modo active" onclick="cambiarModo('plano')" title="Ver plano oficial encuadrado">
      <span>📐</span>
      <span>Solo Plano</span>
    </button>
    <button id="btn-satelital" class="btn-modo" onclick="cambiarModo('satelital')" title="Ver foto satelital real">
      <span>🛰️</span>
      <span>Satelital</span>
    </button>
    <button id="btn-mixto" class="btn-modo" onclick="cambiarModo('mixto')" title="Ver plano sobrepuesto con transparencia sobre el terreno">
      <span>🗺️</span>
      <span>Mixto</span>
    </button>
  </div>

  <!-- ====================================================================== -->
  <!-- 3. BOTÓN VOLVER A PROYECTOS (SUPERIOR IZQUIERDA) -->
  <!-- ====================================================================== -->
  <div class="floating-ui absolute top-4 left-4">
    <a href="proyectos.html"
      class="inline-flex items-center gap-2 px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-2xl bg-white/95 hover:bg-white text-slate-800 font-display font-extrabold text-xs sm:text-sm border border-slate-200 shadow-xl transition-all hover:scale-105 active:scale-95">
      <svg class="w-4 h-4 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span class="hidden sm:inline">Volver a Proyectos</span>
      <span class="sm:hidden">Volver</span>
    </a>
  </div>

  <!-- ====================================================================== -->
  <!-- 4. BOTONES DE ACCIÓN RÁPIDA (SUPERIOR DERECHA) -->
  <!-- ====================================================================== -->
  <div class="floating-ui absolute top-4 right-4 flex flex-col gap-2">
    <!-- Botón Google Maps con el pin exacto -->
    <a href="https://maps.app.goo.gl/KaPB19dWuAUJXgaH8" target="_blank" rel="noopener noreferrer"
      class="w-10 h-10 rounded-2xl bg-white/95 hover:bg-white text-red-600 shadow-xl border border-slate-200 flex items-center justify-center transition-all hover:scale-110 active:scale-95"
      title="Ver Pin Oficial en Google Maps">
      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </a>

    <!-- Botón Alternar Panel de Calibración -->
    <button id="btn-toggle-calib"
      class="w-10 h-10 rounded-2xl bg-white/95 hover:bg-white text-emerald-700 hover:text-emerald-800 shadow-xl border border-slate-200 flex items-center justify-center transition-all hover:scale-110 active:scale-95"
      title="Herramienta de Calibración Manual">
      <span class="text-base">🎯</span>
    </button>

    <!-- Botón Centrar Mapa -->
    <button id="btn-recenter"
      class="w-10 h-10 rounded-2xl bg-white/95 hover:bg-white text-slate-700 hover:text-emerald-700 shadow-xl border border-slate-200 flex items-center justify-center transition-all hover:scale-110 active:scale-95"
      title="Centrar en el Terreno Oficial">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
      </svg>
    </button>
  </div>

  <!-- ====================================================================== -->
  <!-- 5. PANEL FLOTANTE DE CALIBRACIÓN MANUAL EN TIEMPO REAL -->
  <!-- ====================================================================== -->
  <div id="panel-calibracion"
    class="floating-ui calib-panel absolute bottom-4 right-4 left-4 sm:left-auto sm:w-[460px] p-5 shadow-2xl">
    
    <div class="flex items-center justify-between pb-3 border-b border-slate-700/80 mb-3">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></span>
        <h3 class="font-display font-extrabold text-sm sm:text-base text-white tracking-wide">
          🎯 Calibrador Manual de Plano en Vivo
        </h3>
      </div>
      <button id="btn-close-calib" class="text-slate-400 hover:text-white font-bold text-sm px-1.5 py-0.5 rounded-lg hover:bg-slate-800">
        ✕
      </button>
    </div>

    <p class="text-xs text-slate-300 leading-relaxed mb-3">
      Arrastra las dos esquinas (<span class="text-emerald-400 font-bold">🟢 NW Noroeste</span> y <span class="text-orange-400 font-bold">🟠 SE Sureste</span>) para encuadrar la imagen exactamente sobre la parcela satelital de Hardeman.
    </p>

    <!-- Control de Opacidad en Vivo -->
    <div class="space-y-1.5 mb-3 bg-slate-800/70 p-3 rounded-xl border border-slate-700/50">
      <div class="flex items-center justify-between text-xs">
        <span class="text-slate-300 font-semibold">Opacidad del Plano:</span>
        <span id="label-opacidad" class="font-extrabold text-emerald-400">80%</span>
      </div>
      <input type="range" id="range-opacidad" min="10" max="100" value="80"
        class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
    </div>

    <!-- Código Resultante en Tiempo Real -->
    <div class="space-y-1.5 mb-3">
      <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block">
        Coordenadas Resultantes:
      </span>
      <pre id="code-bounds" class="bg-slate-950 p-2.5 rounded-xl text-[11px] font-mono text-emerald-400 overflow-x-auto border border-slate-800 select-all leading-tight"></pre>
    </div>

    <!-- Botones de Acción del Calibrador -->
    <div class="flex items-center gap-2">
      <button id="btn-copy-bounds"
        class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-display font-extrabold text-xs shadow-md transition-all active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
        <span id="btn-copy-text">Copiar Coordenadas</span>
      </button>

      <button id="btn-reset-bounds"
        class="py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs border border-slate-700 transition-colors"
        title="Restablecer posición inicial">
        🔄 Restablecer
      </button>
    </div>

  </div>

  <!-- Leaflet JS CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- ====================================================================== -->
  <!-- 6. SCRIPT DE CONTROL WEBGIS CON CALIBRACIÓN EN VIVO -->
  <!-- ====================================================================== -->
  <script>
    // Variables Globales
    let map = null;
    let satLayer = null;
    let osmLayer = null;
    let planoLayer = null;
    let pinOficialMarker = null;
    let markerNW = null;
    let markerSE = null;
    let calibMarkersGroup = null;
    let currentModo = 'plano';

    // Coordenadas Exactas extraídas del enlace oficial de Google Maps:
    // https://maps.app.goo.gl/KaPB19dWuAUJXgaH8 -> 16°40'20.8"S 63°36'43.4"W
    const COORDS_OFICIALES = [-16.672448, -63.612058];
    const DEFAULT_ZOOM = 18;

    // Límites Iniciales calibrados alrededor del pin oficial
    const DEFAULT_BOUNDS = [
      [-16.671000, -63.613800], // Noroeste (NW)
      [-16.673900, -63.610300]  // Sureste (SE)
    ];

    let currentBounds = [
      [DEFAULT_BOUNDS[0][0], DEFAULT_BOUNDS[0][1]],
      [DEFAULT_BOUNDS[1][0], DEFAULT_BOUNDS[1][1]]
    ];

    let currentOpacity = 0.80;

    function initWebGIS() {
      // 1. Inicializar Mapa Centrado en el Pin Oficial
      map = L.map('map', {
        center: COORDS_OFICIALES,
        zoom: DEFAULT_ZOOM,
        minZoom: 14,
        maxZoom: 21,
        zoomControl: true,
        scrollWheelZoom: true,
        smoothWheelZoom: true,
        touchZoom: true,
        dragging: true,
        doubleClickZoom: true,
        boxZoom: true,
        tap: true
      });

      // 2. Capa OpenStreetMap Gratuita
      osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
        maxZoom: 21
      });

      // 3. Capa Esri World Imagery Satelital (Alta Definición)
      satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri World Imagery &bull; Proyecto Berlín (Hardeman)',
        maxNativeZoom: 17,
        maxZoom: 21
      });

      // 4. Capa de la Imagen Oficial del Plano (L.imageOverlay)
      planoLayer = L.imageOverlay('img/plano-berlin.jpg', currentBounds, {
        opacity: 1.0,
        interactive: false,
        alt: 'Plano Oficial Proyecto Berlín Hardeman'
      });

      // 5. Pin Oficial Inamovible de Referencia
      const pinIcon = L.divIcon({
        className: 'custom-pin-marker',
        html: `
          <div style="background-color:#dc2626;color:white;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(220,38,38,0.8);border:2.5px solid white;font-weight:900;font-size:16px;">
            📍
          </div>
        `,
        iconSize: [34, 34],
        iconAnchor: [17, 17]
      });

      pinOficialMarker = L.marker(COORDS_OFICIALES, {
        icon: pinIcon,
        zIndexOffset: 1000
      }).addTo(map);

      pinOficialMarker.bindTooltip("<b>Proyecto Berlín • Pin Oficial</b><br>Hardeman (A 400m Carretera)", {
        permanent: false,
        direction: 'top'
      });

      // 6. Grupo de Marcadores Arrastrables para Calibración Manual
      calibMarkersGroup = L.layerGroup().addTo(map);

      const nwIcon = L.divIcon({
        className: 'custom-corner-icon',
        html: 'NW',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      const seIcon = L.divIcon({
        className: 'custom-corner-icon se',
        html: 'SE',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      markerNW = L.marker(currentBounds[0], {
        draggable: true,
        icon: nwIcon,
        zIndexOffset: 1200
      }).addTo(calibMarkersGroup);

      markerSE = L.marker(currentBounds[1], {
        draggable: true,
        icon: seIcon,
        zIndexOffset: 1200
      }).addTo(calibMarkersGroup);

      // Evento de Arrastre en Vivo
      function onMarkerDrag() {
        const nw = markerNW.getLatLng();
        const se = markerSE.getLatLng();

        currentBounds = [
          [nw.lat, nw.lng],
          [se.lat, se.lng]
        ];

        const latLngBounds = L.latLngBounds(nw, se);
        planoLayer.setBounds(latLngBounds);
        actualizarCodigoBounds();
      }

      markerNW.on('drag', onMarkerDrag);
      markerSE.on('drag', onMarkerDrag);

      // Iniciar en Modo 1: Solo Plano
      cambiarModo('plano');
      actualizarCodigoBounds();

      // Configurar Controles de la Interfaz
      setupUIControls();

      setTimeout(() => {
        map.invalidateSize();
      }, 200);
    }

    // Actualizar Texto del Código en el Panel
    function actualizarCodigoBounds() {
      const codeBlock = document.getElementById('code-bounds');
      const nwLat = currentBounds[0][0].toFixed(6);
      const nwLng = currentBounds[0][1].toFixed(6);
      const seLat = currentBounds[1][0].toFixed(6);
      const seLng = currentBounds[1][1].toFixed(6);

      const codigo = `const planoBounds = [\n  [${nwLat}, ${nwLng}], // Noroeste (NW)\n  [${seLat}, ${seLng}]  // Sureste (SE)\n];`;
      codeBlock.textContent = codigo;
    }

    // ========================================================================
    // CONTROL DE LOS 3 MODOS
    // ========================================================================
    window.cambiarModo = function(modo) {
      currentModo = modo;

      document.querySelectorAll('.btn-modo').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${modo}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (!map) return;

      if (modo === 'plano') {
        // MODO 1: SOLO PLANO
        if (map.hasLayer(satLayer)) map.removeLayer(satLayer);
        if (!map.hasLayer(osmLayer)) osmLayer.addTo(map);
        if (!map.hasLayer(planoLayer)) planoLayer.addTo(map);
        planoLayer.setOpacity(1.0);

      } else if (modo === 'satelital') {
        // MODO 2: SOLO SATELITAL
        if (map.hasLayer(osmLayer)) map.removeLayer(osmLayer);
        if (map.hasLayer(planoLayer)) map.removeLayer(planoLayer);
        if (!map.hasLayer(satLayer)) satLayer.addTo(map);

      } else if (modo === 'mixto') {
        // MODO 3: MIXTO / HÍBRIDO
        if (map.hasLayer(osmLayer)) map.removeLayer(osmLayer);
        if (!map.hasLayer(satLayer)) satLayer.addTo(map);
        if (!map.hasLayer(planoLayer)) planoLayer.addTo(map);
        planoLayer.setOpacity(currentOpacity);
      }

      map.invalidateSize();
    };

    // Configurar Eventos de la UI
    function setupUIControls() {
      // 1. Recentrar en el Pin Oficial
      document.getElementById('btn-recenter').addEventListener('click', () => {
        map.flyTo(COORDS_OFICIALES, DEFAULT_ZOOM, { duration: 1 });
      });

      // 2. Toggle Panel de Calibración
      const panel = document.getElementById('panel-calibracion');
      document.getElementById('btn-toggle-calib').addEventListener('click', () => {
        panel.classList.toggle('hidden');
        if (calibMarkersGroup) {
          if (panel.classList.contains('hidden')) {
            map.removeLayer(calibMarkersGroup);
          } else {
            map.addLayer(calibMarkersGroup);
          }
        }
      });

      document.getElementById('btn-close-calib').addEventListener('click', () => {
        panel.classList.add('hidden');
        if (calibMarkersGroup) map.removeLayer(calibMarkersGroup);
      });

      // 3. Slider de Opacidad en Vivo
      const rangeOpacidad = document.getElementById('range-opacidad');
      const labelOpacidad = document.getElementById('label-opacidad');
      rangeOpacidad.addEventListener('input', (e) => {
        currentOpacity = parseFloat(e.target.value) / 100;
        labelOpacidad.textContent = `${e.target.value}%`;
        if (currentModo === 'mixto' && planoLayer) {
          planoLayer.setOpacity(currentOpacity);
        }
      });

      // 4. Copiar Coordenadas al Portapapeles
      const btnCopy = document.getElementById('btn-copy-bounds');
      const btnCopyText = document.getElementById('btn-copy-text');
      btnCopy.addEventListener('click', () => {
        const codeText = document.getElementById('code-bounds').textContent;
        navigator.clipboard.writeText(codeText).then(() => {
          btnCopyText.textContent = "¡Copiado al Portapapeles! ✅";
          btnCopy.classList.replace('bg-emerald-600', 'bg-emerald-700');
          setTimeout(() => {
            btnCopyText.textContent = "Copiar Coordenadas";
            btnCopy.classList.replace('bg-emerald-700', 'bg-emerald-600');
          }, 2500);
        });
      });

      // 5. Restablecer Posición Inicial
      document.getElementById('btn-reset-bounds').addEventListener('click', () => {
        currentBounds = [
          [DEFAULT_BOUNDS[0][0], DEFAULT_BOUNDS[0][1]],
          [DEFAULT_BOUNDS[1][0], DEFAULT_BOUNDS[1][1]]
        ];
        markerNW.setLatLng(currentBounds[0]);
        markerSE.setLatLng(currentBounds[1]);
        planoLayer.setBounds(L.latLngBounds(currentBounds[0], currentBounds[1]));
        actualizarCodigoBounds();
      });
    }

    // Inicialización al cargar el DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWebGIS);
    } else {
      initWebGIS();
    }

    window.addEventListener('resize', () => {
      if (map) map.invalidateSize();
    });
  </script>

</body>

</html>

      { id: "M2-L9", mz: "M-2", lote: 9,  lat: -16.672473, lng: -63.611661, estado: "disponible", sup: 961.57 },
      { id: "M2-L10", mz: "M-2", lote: 10, lat: -16.672306, lng: -63.611685, estado: "disponible", sup: 290.71 },
      { id: "M2-L11", mz: "M-2", lote: 11, lat: -16.672221, lng: -63.611752, estado: "disponible", sup: 324.72 },
      { id: "M2-L12", mz: "M-2", lote: 12, lat: -16.672147, lng: -63.611824, estado: "disponible", sup: 319.61 },
      { id: "M2-L13", mz: "M-2", lote: 13, lat: -16.672064, lng: -63.611905, estado: "disponible", sup: 314.50 },

      // Manzana M-3 (5 Lotes)
      { id: "M3-L1", mz: "M-3", lote: 1, lat: -16.672514, lng: -63.612538, estado: "ocupado",    sup: 350.00 },
      { id: "M3-L2", mz: "M-3", lote: 2, lat: -16.672427, lng: -63.612455, estado: "disponible", sup: 362.64 },
      { id: "M3-L3", mz: "M-3", lote: 3, lat: -16.672344, lng: -63.612377, estado: "disponible", sup: 374.28 },
      { id: "M3-L4", mz: "M-3", lote: 4, lat: -16.672262, lng: -63.612302, estado: "disponible", sup: 362.64 },
      { id: "M3-L5", mz: "M-3", lote: 5, lat: -16.672187, lng: -63.612235, estado: "disponible", sup: 365.31 }
    ];

    // ========================================================================
    // DATASET OFICIAL DEFINITIVO CALIBRADO (3 ÁREAS VERDES)
    // ========================================================================
    const AREAS_VERDES = [
      { id: "AV-1", nombre: "Área Verde 1", lat: -16.672815, lng: -63.612231 },
      { id: "AV-2", nombre: "Área Verde 2", lat: -16.672425, lng: -63.612052 },
      { id: "AV-3", nombre: "Parque / Área Verde Central", lat: -16.671897, lng: -63.612087 }
    ];

    function initWebGIS() {
      // 1. Instanciar Mapa Fullscreen
      map = L.map('map', {
        center: CENTER_COORDS,
        zoom: DEFAULT_ZOOM,
        minZoom: 14,
        maxZoom: 21,
        zoomControl: true,
        scrollWheelZoom: true,
        smoothWheelZoom: true,
        touchZoom: true,
        dragging: true,
        doubleClickZoom: true,
        boxZoom: true,
        tap: true
      });

      // 2. Capa OpenStreetMap Gratuita
      osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
        maxZoom: 21
      });

      // 3. Capa Esri World Imagery Satelital
      satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri World Imagery &bull; Proyecto Berlín (Hardeman)',
        maxNativeZoom: 17,
        maxZoom: 21
      });

      // 4. Montaje Inamovible del Plano Oficial Definitivo
      planoOverlay = L.imageOverlay('img/plano-tecnico-berlin.jpg', planoBounds, {
        opacity: 1.0,
        interactive: false,
        alt: 'Plano Oficial Calibrado Proyecto Berlín'
      });

      // 5. Capas de Marcadores Fijos
      lotesMarkersGroup = L.layerGroup();
      greenAreasGroup = L.layerGroup();
      const lotSheet = document.getElementById('lot-sheet');

      // Renderizar 27 Lotes
      LOTES_CALIBRADOS.forEach(lote => {
        const isDisp = lote.estado === 'disponible';
        const precioTotal = lote.sup * PRECIO_M2;

        const numIcon = L.divIcon({
          className: 'custom-lot-divicon',
          html: `<div class="lot-badge-icon ${isDisp ? 'disponible' : 'ocupado'}">${lote.lote}</div>`,
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });

        const marker = L.marker([lote.lat, lote.lng], {
          icon: numIcon,
          draggable: false,
          zIndexOffset: isDisp ? 600 : 400
        }).addTo(lotesMarkersGroup);

        marker.bindTooltip(`
          <b>Manzana ${lote.mz} &bull; Lote ${lote.lote}</b><br>
          <span style="color:${isDisp ? '#15803d' : '#ea580c'};font-weight:bold;">
            ${isDisp ? '★ DISPONIBLE ($7/m²)' : '● VENDIDO / OCUPADO'}
          </span><br>
          <span style="color:#475569;">${lote.sup.toFixed(2)} m² • $${precioTotal.toLocaleString('en-US', { minimumFractionDigits: 2 })} USD</span>
        `, {
          permanent: false,
          direction: 'top',
          offset: [0, -12]
        });

        // Evento Click / Tap: Abrir Ficha Técnica
        marker.on('click', function(e) {
          L.DomEvent.stopPropagation(e);

          document.getElementById('sheet-manzana').textContent = `MANZANA ${lote.mz}`;
          document.getElementById('sheet-lote').textContent = `LOTE ${lote.lote < 10 ? '0' + lote.lote : lote.lote}`;
          document.getElementById('sheet-superficie').textContent = `${lote.sup.toFixed(2)} m²`;

          const estadoBadge = document.getElementById('sheet-estado');
          if (isDisp) {
            estadoBadge.textContent = 'DISPONIBLE';
            estadoBadge.className = 'font-bold px-2.5 py-0.5 rounded-full text-xs bg-emerald-100 text-emerald-800 border border-emerald-300';
          } else {
            estadoBadge.textContent = 'VENDIDO / OCUPADO';
            estadoBadge.className = 'font-bold px-2.5 py-0.5 rounded-full text-xs bg-orange-100 text-orange-800 border border-orange-300';
          }

          document.getElementById('sheet-precio-usd').textContent = `$${precioTotal.toLocaleString('en-US', { minimumFractionDigits: 2 })} USD`;
          
          const precioBs = (precioTotal * TIPO_CAMBIO).toLocaleString('es-BO', { minimumFractionDigits: 2 });
          document.getElementById('sheet-precio-bs').textContent = `~Bs. ${precioBs}`;

          const cuotaDirecta = (precioTotal / 120).toFixed(2);
          document.getElementById('sheet-cuota').textContent = `Desde $${cuotaDirecta} USD/mes (120 meses)`;

          const msgWhatsApp = `Hola, estoy viendo el plano del Proyecto Berlín y quiero cotizar la Manzana ${lote.mz} Lote ${lote.lote} de ${lote.sup.toFixed(2)}m2`;
          document.getElementById('sheet-whatsapp-btn').href = `https://wa.me/59170832781?text=${encodeURIComponent(msgWhatsApp)}`;

          lotSheet.classList.remove('hidden-sheet');
        });
      });

      // Renderizar 3 Áreas Verdes
      AREAS_VERDES.forEach(av => {
        const avIcon = L.divIcon({
          className: 'custom-av-divicon',
          html: `<div class="green-area-badge"><span>🌳</span><span>${av.nombre}</span></div>`,
          iconSize: [110, 24],
          iconAnchor: [55, 12]
        });

        const marker = L.marker([av.lat, av.lng], {
          icon: avIcon,
          draggable: false,
          zIndexOffset: 800
        }).addTo(greenAreasGroup);

        marker.bindTooltip(`<b>${av.nombre}</b><br><span style="color:#047857;font-weight:bold;">Área Verde Protegida</span>`, {
          permanent: false,
          direction: 'top',
          offset: [0, -12]
        });
      });

      // Cerrar Ficha Técnica
      document.getElementById('btn-close-sheet').addEventListener('click', () => {
        lotSheet.classList.add('hidden-sheet');
      });

      map.on('click', () => {
        lotSheet.classList.add('hidden-sheet');
      });

      // Botón Recentrar al Plano
      document.getElementById('btn-recenter').addEventListener('click', () => {
        map.flyToBounds(planoBounds, { duration: 1 });
      });

      // Botón Pantalla Completa
      const btnFullscreen = document.getElementById('btn-fullscreen');
      if (btnFullscreen) {
        btnFullscreen.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          }
        });
      }

      // Toggle Leyenda
      const toggleLegendBtn = document.getElementById('btn-toggle-legend');
      const legendContent = document.getElementById('legend-content');
      toggleLegendBtn.addEventListener('click', () => {
        if (legendContent.classList.contains('hidden')) {
          legendContent.classList.remove('hidden');
          toggleLegendBtn.textContent = '−';
        } else {
          legendContent.classList.add('hidden');
          toggleLegendBtn.textContent = '+';
        }
      });

      // Listeners para las pestañas de conmutador de capas
      document.querySelectorAll('.layer-tab').forEach(tab => {
        tab.addEventListener('click', function(e) {
          e.preventDefault();
          const mode = this.getAttribute('data-mode');
          if (mode) cambiarModo(mode);
        });
      });

      // Iniciar en Modo 1: Solo Plano
      cambiarModo('plano');

      setTimeout(() => {
        map.invalidateSize();
      }, 200);
    }

    // ========================================================================
    // CONTROL DE LOS 3 MODOS
    // ========================================================================
    window.cambiarModo = function(modo) {
      currentModo = modo;

      document.querySelectorAll('.layer-tab, .btn-modo, .layer-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.querySelector(`.layer-tab[data-mode="${modo}"]`) ||
                        document.querySelector(`[data-mode="${modo}"]`) ||
                        document.getElementById(`btn-${modo}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (!map) return;

      if (modo === 'plano') {
        // MODO 1: SOLO PLANO (OpenStreetMap + Plano Técnico + Marcadores)
        if (map.hasLayer(satLayer)) map.removeLayer(satLayer);
        if (!map.hasLayer(osmLayer)) osmLayer.addTo(map);
        if (!map.hasLayer(planoOverlay)) planoOverlay.addTo(map);
        if (!map.hasLayer(lotesMarkersGroup)) lotesMarkersGroup.addTo(map);
        if (!map.hasLayer(greenAreasGroup)) greenAreasGroup.addTo(map);
        planoOverlay.setOpacity(1.0);

      } else if (modo === 'satelital') {
        // MODO 2: SOLO SATELITAL (Foto Satelital Limpia)
        if (map.hasLayer(osmLayer)) map.removeLayer(osmLayer);
        if (map.hasLayer(planoOverlay)) map.removeLayer(planoOverlay);
        if (map.hasLayer(lotesMarkersGroup)) map.removeLayer(lotesMarkersGroup);
        if (map.hasLayer(greenAreasGroup)) map.removeLayer(greenAreasGroup);
        if (!map.hasLayer(satLayer)) satLayer.addTo(map);

        const sheet = document.getElementById('lot-sheet');
        if (sheet) sheet.classList.add('hidden-sheet');

      } else if (modo === 'mixto') {
        // MODO 3: MIXTO / HÍBRIDO (Satélite + Plano opacidad 0.82 + Marcadores)
        if (map.hasLayer(osmLayer)) map.removeLayer(osmLayer);
        if (!map.hasLayer(satLayer)) satLayer.addTo(map);
        if (!map.hasLayer(planoOverlay)) planoOverlay.addTo(map);
        if (!map.hasLayer(lotesMarkersGroup)) lotesMarkersGroup.addTo(map);
        if (!map.hasLayer(greenAreasGroup)) greenAreasGroup.addTo(map);
        planoOverlay.setOpacity(0.82);
      }

      map.invalidateSize();
    };

    // Inicialización al cargar el DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWebGIS);
    } else {
      initWebGIS();
    }

    window.addEventListener('resize', () => {
      if (map) map.invalidateSize();
    });
  </script>

  <!-- Motor Multilingüe (i18n) y Gestor de Tema -->
  <script src="js/i18n.js"></script>

</body>
